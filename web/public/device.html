<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Deskpad sign-in</title>
    <style>
      :root {
        --bg: #15171c; --card: #1d2027; --field: #262a33; --fg: #e8eaf0; --fg-2: #9aa0ae;
        --accent: #6c9cff; --accent-fg: #0f1320; --danger: #ff6b6b; --border: #2c3039; --ok: #4cd27f;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7f9; --card: #ffffff; --field: #f0f1f5; --fg: #1b1d23; --fg-2: #5c6270;
          --accent: #2f63d6; --accent-fg: #ffffff; --danger: #d64545; --border: #dcdee5; --ok: #1f9e58;
          color-scheme: light;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg);
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: var(--fg-2); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        width: 100%; padding: 11px 14px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      button.link { border: 0; width: auto; padding: 0; font-weight: 400; color: var(--accent); }
      button.google { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--field); }
      button.google svg { width: 18px; height: 18px; flex-shrink: 0; }
      button[disabled] { opacity: 0.6; cursor: wait; }
      .row { display: flex; gap: 10px; }
      .code { font: 600 22px/1 "Cascadia Code", Consolas, monospace; letter-spacing: 2px; text-align: center; padding: 14px; background: var(--field); border-radius: 8px; margin-bottom: 16px; }
      .error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 10px; }
      .foot { margin: 16px 0 0; font-size: 13px; }
      .ok { color: var(--ok); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Deskpad</h1>

      <section id="v-loading"><p>One moment…</p></section>

      <section id="v-auth" hidden>
        <p id="auth-lead">Sign in to continue. New here? The same button creates your account.</p>
        <button id="btn-google" class="google" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Continue with Google
        </button>
        <div class="error" id="auth-error" role="alert"></div>
        <p class="foot">Deskpad asks Google for your calendar too, so your day shows up without a second sign-in.</p>
      </section>

      <section id="v-approve" hidden>
        <p>Connect the Deskpad app on your PC to <b id="who"></b>? Check that it shows this code:</p>
        <div class="code" id="code"></div>
        <div class="row">
          <button id="btn-deny" type="button">Cancel</button>
          <button class="primary" id="btn-approve" type="button">Connect</button>
        </div>
        <div class="error" id="approve-error" role="alert"></div>
      </section>

      <section id="v-done" hidden>
        <p id="done-text" class="ok"></p>
        <p class="foot"><button class="link" id="btn-signout" type="button">Sign out of this browser</button></p>
      </section>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const show = (id) => ["v-loading", "v-auth", "v-approve", "v-done"].forEach((v) => ($(v).hidden = v !== id));
      const params = new URLSearchParams(location.search);
      const userCode = (params.get("user_code") ?? "").trim();
      // Where Google sends the browser back to: this page, without a stale error.
      const here = location.pathname + (userCode ? `?user_code=${encodeURIComponent(userCode)}` : "");

      async function api(path, body) {
        const res = await fetch(`/api/auth${path}`, {
          method: body === undefined ? "GET" : "POST",
          headers: body === undefined ? {} : { "content-type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
          credentials: "same-origin",
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(data?.message || data?.error_description || `Something went wrong (${res.status}).`);
        return data;
      }

      /** What a failed return from Google means, in plain words. */
      function explain(code) {
        if (!code) return "";
        if (/signup|unable_to_create_user|forbidden/i.test(code)) return "This Deskpad server isn't taking new accounts.";
        if (/access_denied/i.test(code)) return "Google sign-in was cancelled.";
        return "Google sign-in didn't complete. Try again.";
      }

      async function route() {
        const me = await api("/get-session").catch(() => null);
        if (!me?.user) {
          $("auth-error").textContent = explain(params.get("error"));
          return show("v-auth");
        }
        if (!userCode) {
          $("done-text").textContent = `Signed in as ${me.user.email}.`;
          return show("v-done");
        }
        try {
          // Claims the code for this account and reports where it stands.
          const state = await api(`/device?user_code=${encodeURIComponent(userCode)}`);
          if (state.status !== "pending") {
            $("done-text").textContent = state.status === "approved" ? "This PC is already connected. You can close this tab." : "That request was cancelled. Start again from the app.";
            return show("v-done");
          }
        } catch (err) {
          $("done-text").textContent = "That code is not valid any more. Start again from the Deskpad app.";
          $("done-text").className = "error";
          return show("v-done");
        }
        $("who").textContent = me.user.email;
        $("code").textContent = userCode;
        show("v-approve");
      }

      $("btn-google").addEventListener("click", async () => {
        const btn = $("btn-google");
        btn.disabled = true;
        $("auth-error").textContent = "";
        try {
          const r = await api("/sign-in/social", { provider: "google", callbackURL: here, errorCallbackURL: here });
          if (r?.url) location.href = r.url;
          else throw new Error("Google sign-in isn't set up on this server yet.");
        } catch (err) {
          $("auth-error").textContent = err.message;
          btn.disabled = false;
        }
      });

      for (const [id, path, text] of [
        ["btn-approve", "/device/approve", "Connected. You can close this tab and go back to Deskpad."],
        ["btn-deny", "/device/deny", "Cancelled. Nothing was connected."],
      ]) {
        $(id).addEventListener("click", async () => {
          $(id).disabled = true;
          try {
            await api(path, { userCode });
            $("done-text").textContent = text;
            show("v-done");
          } catch (err) {
            $("approve-error").textContent = err.message;
          } finally {
            $(id).disabled = false;
          }
        });
      }

      $("btn-signout").addEventListener("click", async () => {
        await api("/sign-out", {}).catch(() => {});
        location.href = here;
      });

      fetch("/api/v1/auth-methods")
        .then((r) => r.json())
        .then((m) => {
          if (!m.google) {
            $("btn-google").disabled = true;
            $("auth-error").textContent = "Google sign-in isn't set up on this server yet.";
          }
        })
        .catch(() => {});
      route();
    </script>
  </body>
</html>
