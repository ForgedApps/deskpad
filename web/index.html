<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Deskpad" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <title>Deskpad</title>
  </head>
  <body class="web">
    <div id="boot" class="boot">Deskpad</div>

    <div id="app" class="app" hidden>
      <header class="top">
        <h1>Notes <span id="task-count" class="count" title="Open tasks"></span></h1>
        <button id="btn-clear-done" class="link" hidden>archive completed</button>
        <span class="spacer"></span>
        <span id="sync-dot" class="sync-dot" role="status" aria-label="Sync status"></span>
        <button id="btn-menu" class="icon" aria-label="Account and sync" aria-haspopup="true">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="19" cy="12" r="1.4" /></svg>
        </button>
      </header>

      <div id="banner" class="banner" hidden>
        <span id="banner-text"></span>
        <button id="banner-action" class="link" hidden></button>
      </div>

      <main id="outline" class="list outline"></main>

      <div id="menu" class="menu" hidden>
        <div id="menu-account" class="menu-account"></div>
        <button id="menu-sync" type="button">Sync now</button>
        <button id="menu-signout" type="button" class="danger">Sign out</button>
      </div>

      <nav id="toolbar" class="toolbar" hidden aria-label="Row actions">
        <button type="button" data-act="outdent" aria-label="Move out a level">
          <svg viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M5 12h14" /></svg>
        </button>
        <button type="button" data-act="indent" aria-label="Nest under the row above">
          <svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M19 12H5" /></svg>
        </button>
        <button type="button" data-act="kind" aria-label="Switch between task and note">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" /><path d="M8 12l3 3 5-6" /></svg>
        </button>
        <button type="button" data-act="picture" aria-label="Add a picture">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><circle cx="9" cy="10" r="1.6" /><path d="M4 17l5-4 4 3 3-2 4 3" /></svg>
        </button>
        <button type="button" data-act="archive" aria-label="Archive this row">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M6 7v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7M10 11h4" /></svg>
        </button>
        <span class="spacer"></span>
        <button type="button" data-act="done" class="text">Done</button>
      </nav>
      <input id="pick-image" type="file" accept="image/*" hidden />
    </div>

    <section id="signin" class="signin" hidden>
      <h1>Deskpad</h1>
      <div class="mock" aria-hidden="true">
        <div class="m-clock">9:41 <small>AM</small></div>
        <div class="m-date">Tuesday, November 10</div>
        <div class="m-sec">Today</div>
        <div class="m-ev now"><b>9:30</b><span>Design review</span><em>now</em></div>
        <div class="m-ev"><b>11:00</b><span>Standup</span></div>
        <div class="m-ev"><b>2:30</b><span>1:1 with Sam</span></div>
        <div class="m-sec">Notes</div>
        <div class="m-row"><i class="dot"></i><span>Launch checklist</span></div>
        <div class="m-row child"><i class="box done"></i><span class="struck">Write release notes</span></div>
        <div class="m-row child"><i class="box"></i><span>Send the invites</span></div>
      </div>
      <button id="signin-google" class="google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <div class="error" id="signin-error" role="alert"></div>
      <p class="note">Deskpad syncs with your Google Calendar, so your day sits right beside your notes and tasks.</p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
