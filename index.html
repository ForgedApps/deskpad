<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskpad</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="sidebar">
    <header class="bar" data-tauri-drag-region>
      <div class="clock">
        <div id="clock-time">--:--</div>
        <div id="clock-date"></div>
      </div>
      <div class="bar-actions">
        <button id="btn-capture" class="icon" title="Quick capture (Ctrl+Space)" aria-label="Quick capture">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
        </button>
        <button id="btn-hide" class="icon" title="Collapse to edge" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6" /><path d="M21 4v16" /></svg>
        </button>
      </div>
    </header>

    <section class="panel" id="meetings-panel">
      <div class="panel-head">
        <div class="cal-nav">
          <button id="btn-prev-day" class="icon small" title="Previous day" aria-label="Previous day">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <h2 id="cal-title">Today</h2>
          <button id="btn-next-day" class="icon small" title="Next day" aria-label="Next day">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
          </button>
          <button id="btn-today" class="link" hidden>today</button>
        </div>
        <div class="head-links">
          <button id="btn-add-event" class="icon small" title="Add a calendar event" aria-label="Add a calendar event">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button id="btn-refresh" class="icon small" title="Refresh calendar" aria-label="Refresh calendar">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4" /><path d="M21 3v6h-6" /></svg>
          </button>
        </div>
      </div>
      <form id="event-form" class="event-form" hidden>
        <input id="ev-title" placeholder="Event title" autocomplete="off" />
        <div class="event-row">
          <input id="ev-date" type="date" />
          <input id="ev-time" type="time" step="300" />
          <select id="ev-duration" title="Duration">
            <option value="15">15 min</option>
            <option value="30" selected>30 min</option>
            <option value="45">45 min</option>
            <option value="60">1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <div class="event-row">
          <span id="ev-error" class="error"></span>
          <span class="spacer"></span>
          <button type="button" id="ev-cancel" class="link">cancel</button>
          <button type="submit" class="primary small-btn">Add</button>
        </div>
      </form>
      <div id="meetings" class="list"></div>
    </section>

    <section class="panel grow" id="outline-panel">
      <div class="panel-head">
        <h2>Notes <span id="task-count" class="count" title="Open tasks"></span></h2>
        <div class="head-links">
          <button id="btn-clear-done" class="link" title="Move completed tasks out of the outline (they stay in the journal)" hidden>archive completed</button>
          <button id="btn-journal" class="link" title="Journal: every day's notes, completed tasks and calendar events, including archived rows">journal</button>
        </div>
      </div>
      <div id="outline" class="list outline"></div>
    </section>

    <footer class="hint">
      <kbd>Tab</kbd> nest · <kbd>-</kbd> or <kbd>[]</kbd> task · <kbd>Ctrl</kbd>+<kbd>Space</kbd> capture
    </footer>

    <div id="settings" class="modal hidden">
      <form id="settings-form" class="modal-card">
        <h2>Settings</h2>

        <fieldset>
          <legend>Google Calendar</legend>
          <div id="google-connected" class="google-row hidden">
            <span class="ok">● Connected</span>
            <button type="button" id="btn-google-disconnect">Disconnect</button>
          </div>
          <div id="google-disconnected">
            <label>
              OAuth client ID
              <input id="s-gid" placeholder="…apps.googleusercontent.com" />
            </label>
            <label>
              OAuth client secret
              <input id="s-gsecret" type="password" placeholder="GOCSPX-…" />
              <small>
                Create a <b>Desktop app</b> OAuth client in Google Cloud Console (APIs &amp; Services →
                Credentials) with the Calendar API enabled, then paste both values and connect.
                Shows all calendars you have checked in Google Calendar, with Meet join links.
              </small>
            </label>
            <button type="button" id="btn-google-connect" class="primary">Connect Google Calendar</button>
            <div id="google-error" class="error"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Cloud sync</legend>
          <div id="cloud-on" class="hidden">
            <div id="cloud-state" class="cloud-state"></div>
            <div class="google-row">
              <button type="button" id="btn-cloud-sync">Sync now</button>
              <button type="button" id="btn-cloud-force" class="danger hidden"></button>
              <span class="spacer"></span>
              <button type="button" id="btn-cloud-disconnect">Disconnect</button>
            </div>
          </div>
          <div id="cloud-off">
            <label>
              Sync server
              <input id="s-cloud-url" placeholder="https://…workers.dev" spellcheck="false" />
            </label>
            <label>
              Device token
              <input id="s-cloud-token" type="password" autocomplete="off" />
              <small>
                Backs up your notes, tasks and pictures and keeps your devices in step. Everything
                stays on this PC as well and keeps working offline.
              </small>
            </label>
            <button type="button" id="btn-cloud-connect" class="primary">Connect</button>
            <div id="cloud-error" class="error"></div>
          </div>
        </fieldset>

        <label>
          Show tomorrow's events that start before
          <select id="s-tomorrow"></select>
          <small>The Today view calls out early meetings tomorrow so they don't surprise you.</small>
        </label>
        <label class="check">
          <input id="s-allday" type="checkbox" />
          Show all-day events
        </label>
        <label>
          Sidebar width (px)
          <input id="s-width" type="number" min="240" max="600" />
        </label>
        <label class="check">
          <input id="s-reserve" type="checkbox" />
          Reserve screen space (maximized windows stop at the sidebar)
        </label>
        <label class="check">
          <input id="s-top" type="checkbox" />
          Always on top
        </label>
        <label class="check">
          <input id="s-autostart" type="checkbox" />
          Start Deskpad when I sign in to Windows
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-quit" class="danger">Quit Deskpad</button>
          <span class="spacer"></span>
          <button type="button" id="btn-settings-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </body>
</html>
